<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, the family's app-icon shape.
       Self-coloured on purpose — this file is the Plugin Store icon and the marketing-site
       logo, where there is no `currentColor` to inherit. The control panel nav uses
       icon-mask.svg instead, which is the monochrome silhouette. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#4F46B8"/>
  <g fill="none" stroke="#FEFEFE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- The ball -->
    <circle cx="44" cy="46" r="25"/>
    <!-- Wound strands, clipped to the ball by eye rather than by a clip path so the
         stroke keeps its round caps at the rim. -->
    <path d="M24.5 30.5 A25 25 0 0 0 30.5 65.5"/>
    <path d="M35 22.5 A25 25 0 0 0 52 69.5"/>
    <path d="M57 24 A25 25 0 0 0 62.5 62"/>
    <!-- The loose end, running out to a node — a thread you can follow is the whole idea -->
    <path d="M66.5 57 C74 63 76 70 74 77"/>
  </g>
  <circle cx="73" cy="80" r="6.5" fill="#FEFEFE"/>
</svg>
